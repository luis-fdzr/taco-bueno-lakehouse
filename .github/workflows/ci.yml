name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ingestion tests
      - name: Unit tests
        run: pytest -q

  bundle-validate:
    # Needs repository secrets DATABRICKS_HOST and DATABRICKS_TOKEN; skipped when absent.
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle (dev and prod)
        if: env.DATABRICKS_TOKEN != ''
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t prod
