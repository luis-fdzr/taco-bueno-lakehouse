# Taco Bueno lakehouse: Lakeflow pipeline + daily orchestration job + ML.
# Deploy with the Databricks CLI:  databricks bundle deploy -t dev
bundle:
  name: taco_bueno_lakehouse

include:
  - resources/**/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds every table of the project.
    default: workspace
  schema:
    description: Schema where the pipeline, ML and quality tasks publish their tables.
    default: taco_bueno
  raw_volume_path:
    description: Volume with the raw daily POS exports (TB_Daily_TLD_*.csv). Read-only for the project.
    default: /Volumes/workspace/default/taco-bueno-raw
  landing_volume_path:
    description: Volume where the ingestion task lands external and reference data (sports events, store locations).
    default: /Volumes/workspace/default/taco-bueno-landing
  local_radius_km:
    description: A game is "local" for a store when its venue is within this distance.
    default: "50"
  regional_radius_km:
    description: A team is "regional" for a store when its home venue is within this distance.
    default: "320"
  notification_email:
    description: Recipient of job failure and data-quality alerts.
    default: ${workspace.current_user.userName}
  warehouse_id:
    description: SQL warehouse that runs the dashboard queries (looked up by name).
    lookup:
      warehouse: Serverless Starter Warehouse

# No workspace.host: every target deploys to the workspace of the CLI profile in use
# (databricks auth login --host <workspace-url>), so anyone can reproduce the project.
targets:
  dev:
    # Resources get a "[dev <user>]" prefix (the schema becomes dev_<user>_taco_bueno)
    # and the file-arrival trigger is paused.
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: taco_bueno
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
